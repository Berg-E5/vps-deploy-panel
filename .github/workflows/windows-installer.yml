name: windows-installer
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'windows/**'
      - 'app/**'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure Inno Setup is available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            # choco may install it outside the current session PATH; search the usual locations
            $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if (-not $iscc) {
                $iscc = @(
                    (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
                    (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
                    (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
                ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            if (-not $iscc) { throw 'Inno Setup still unavailable after install' }
          }
          # Do not probe the version with "ISCC.exe /?": it writes usage to stderr,
          # which ErrorActionPreference=Stop turns into a terminating error.
          Write-Host "Inno Setup: $($iscc.Source)"

      - name: Build Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\windows\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "installer build failed: $LASTEXITCODE" }

      - name: Verify installer output
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Path .\dist -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no installer produced' }
          if ($setup.Length -lt 5MB) { throw "installer suspiciously small: $($setup.Length)" }
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB"

      - name: Install and smoke-test the installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem -Path .\dist -Filter '*Setup.exe' | Select-Object -First 1).FullName
          # Install into a scratch directory; never touch an existing install.
          # Start-Process -Wait matters: Inno Setup returns before all files are
          # copied, so checking right after the call can see a half-extracted
          # runtime and fail with a bogus "No module named 'urllib'".
          $process = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-',
            "/DIR=$env:RUNNER_TEMP\vpsdeploy-test", '/TASKS=autostart'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exit code $($process.ExitCode)" }
          $appDir = Join-Path $env:RUNNER_TEMP 'vpsdeploy-test'
          $python = Join-Path $appDir 'runtime\python\python.exe'
          if (-not (Test-Path $python)) { throw 'bundled runtime missing after install' }
          # Verify dependencies via a file: PowerShell strips the quotes inside -c.
          # Use a line array, not a here-string: a here-string terminator must start
          # at column 0, which truncates the YAML block scalar.
          $verify = Join-Path $env:RUNNER_TEMP 'verify_deps.py'
          @('import fastapi, uvicorn, pydantic, httpx, paramiko, keyring', 'print("deps ok")') |
              Set-Content -Path $verify -Encoding UTF8
          & $python $verify
          if ($LASTEXITCODE -ne 0) { throw 'dependency import failed after install' }
          & (Join-Path $appDir 'PanelState.ps1') -Status
          # Uninstall, then confirm nothing is left behind
          $uninstaller = Get-ChildItem -Path $appDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'uninstaller missing' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exit code $($uninstall.ExitCode)" }
          # Inno Setup can leave the directory behind for a moment after exit
          for ($i = 0; $i -lt 20 -and (Test-Path $appDir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $appDir) { throw "uninstall left files behind: $appDir" }
          Write-Host 'install + uninstall round-trip ok.'

      - name: Upload installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VPSDeployPanel-Windows-Setup
          path: dist/*Setup.exe
          if-no-files-found: error

      - name: Publish the installer as a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Path .\dist -Filter '*Setup.exe' | Select-Object -First 1
          $tag = $env:GITHUB_REF_NAME
          # If the release already exists, replace the asset instead of failing.
          # gh writes to stderr when the release is missing, and with
          # ErrorActionPreference=Stop that would be a terminating error, so
          # relax it for this call and rely on the exit code instead.
          $ErrorActionPreference = 'Continue'
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          $found = ($LASTEXITCODE -eq 0) -and [bool]$existing
          $ErrorActionPreference = 'Stop'
          if ($found) {
            gh release upload $tag $setup.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            # Release notes come from a repo file: a here-string terminator must start
            # at column 0, which truncates the YAML block scalar.
            $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Copy-Item -Path '.\windows\RELEASE-NOTES.md' -Destination $notesFile -Force
            gh release create $tag $setup.FullName --repo $env:GITHUB_REPOSITORY --title "VPS Deploy Panel $tag (Windows Setup)" --notes-file $notesFile
          }
          Write-Host "release published: $tag"
