name: tests
on:
  push:
  pull_request:
jobs:
  api-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile application code
        run: python -m compileall -q app
      - name: Validate frontend JavaScript syntax
        run: node --check app/static/app.js
      - name: Smoke-test server UI and SSH verification interactions
        run: node tests/ui_smoke.cjs
      - name: Validate theme controller syntax
        run: node --check app/static/theme.js
      - name: Test appearance themes and accessibility
        run: node tests/theme_smoke.cjs

      - name: Validate Windows PowerShell 5.1 launcher and updater
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relativePath in @('scripts/Start-Windows.ps1', 'scripts/Update-Windows.ps1', 'scripts/QuickStart-Windows.ps1', 'scripts/Enable-Codex-Windows.ps1', 'windows/PanelState.ps1', 'windows/Uninstall.ps1', 'windows/build-installer.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE ($relativePath -replace '/', '\')
            $content = [System.IO.File]::ReadAllBytes($path)
            if ($content.Length -lt 3 -or $content[0] -ne 239 -or $content[1] -ne 187 -or $content[2] -ne 191) {
              throw "$relativePath must have a UTF-8 BOM for Windows PowerShell 5.1"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$relativePath has parser errors: $($parseErrors -join '; ')"
            }
            Write-Host "$relativePath parsed successfully."
          }

      - name: Validate Windows installer definition and icon generator
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Installer definition: these constraints must not be broken
          $iss = Join-Path $env:GITHUB_WORKSPACE 'windows\installer.iss'
          $content = [System.IO.File]::ReadAllText($iss)
          foreach ($required in @(
            'PrivilegesRequired=lowest',
            'DefaultDirName={localappdata}\Programs',
            'OutputBaseFilename=VPSDeployPanel-',
            'UninstallRun',
            'UninstallDisplayIcon'
          )) {
            if ($content -notlike "*$required*") { throw "installer.iss missing: $required" }
          }
          # The icon generator must use only the standard library (no Pillow in CI)
          $icon = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'windows\make-icon.py'))
          if ($icon -match '(?m)^\s*(import|from)\s+PIL') { throw 'make-icon.py must not depend on PIL' }
          python (Join-Path $env:GITHUB_WORKSPACE 'windows\make-icon.py') (Join-Path $env:RUNNER_TEMP 'icon.ico')
          if ($LASTEXITCODE -ne 0) { throw 'icon generation failed' }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'icon.ico'))) { throw 'icon.ico not produced' }
          Write-Host 'installer definition and icon generator validated.'
