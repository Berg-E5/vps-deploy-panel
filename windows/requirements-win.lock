# Windows 安装包依赖锁定表
#
# 与 requirements.txt 的区别:
#   requirements.txt      给源码运行时用, 允许版本范围, 方便跟随上游安全更新
#   requirements-win.lock 本安装包用, 钉死版本 + SHA-256
#
# 为什么单独锁: 安装包是发给最终用户下载运行的, 必须可复现 ——
# PyPI 上游一旦发布有问题的版本, 用版本范围的安装包会直接坏给所有下载的人。
#
# 重新生成:
#   pip download --only-binary=:all: --dest wheels -r requirements.txt
#   然后按下载到的 wheel 写版本和 --hash=sha256
#
# 升级依赖时改这里, 并同步跑一遍安装包冒烟测试。
